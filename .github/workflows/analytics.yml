name: GA4 と Search Console の数字の取得

on:
  schedule:
    - cron: "0 20 * * *"   # 毎日 05:00 JST
  workflow_dispatch: {}     # 手動実行(Actionsタブの「Run workflow」)

permissions:
  contents: write

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-analytics-data google-api-python-client google-auth
      - name: GA4 から取得
        env:
          GA_KEY: ${{ secrets.GA_KEY }}
        run: python3 analytics/fetch_stats.py
      - name: Search Console から取得(失敗しても GA4 の更新は続ける)
        continue-on-error: true
        env:
          GA_KEY: ${{ secrets.GA_KEY }}
        run: python3 analytics/fetch_gsc.py
      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analytics.json data/search_console.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "アクセス数データを更新"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
